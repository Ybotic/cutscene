services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-clipper-backend:local
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./temp:/app/temp
      - ./output:/app/output
      - ./data:/app/data

  worker:
    image: ai-clipper-backend:local
    command: ["python", "-m", "backend.worker"]
    init: true
    stop_grace_period: 2m
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./output:/app/output
      - ./data:/app/data

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
